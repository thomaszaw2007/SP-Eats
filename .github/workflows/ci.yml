name: SP Eats checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sp_eats_ci:local-service-fixture@127.0.0.1:5432/sp_eats_test
      SP_EATS_RESET_DATABASE: sp_eats_test
      PORT: 3001
      PLAYWRIGHT_BROWSERS_PATH: '0'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sp_eats_test
          POSTGRES_USER: sp_eats_ci
          POSTGRES_PASSWORD: local-service-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sp_eats_ci -d sp_eats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Set a disposable moderator key
        run: |
          key=$(node -p "require('node:crypto').randomBytes(32).toString('hex')")
          echo "::add-mask::$key"
          echo "ADMIN_ACCESS_TOKEN=$key" >> "$GITHUB_ENV"
      - run: npm test
