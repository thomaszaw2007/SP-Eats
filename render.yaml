services:
  - type: web
    name: sp-eats
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24.10.0'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ACCESS_TOKEN
        sync: false
