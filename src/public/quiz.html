<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Should I Eat | SP QuickBite</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="quiz-decision-page">
    <nav class="home-navbar quiz-decision-navbar">
      <a href="./index.html" class="home-logo">
        <span class="home-logo-badge">SP</span>
        <span>QuickBite</span>
      </a>

      <div class="home-nav-links">
        <a href="./index.html">Home</a>
        <a href="./stalls.html">Stalls</a>
        <a href="./food-map.html">Map</a>
        <a href="./reviews.html">Reviews</a>
        <a href="./quiz.html" class="active">Quiz</a>
      </div>
    </nav>

    <header class="decision-hero">
      <span>Smart Food Decision Helper</span>
      <h1>What Should I Eat</h1>
    </header>

    <main class="decision-main">
      <section class="decision-quiz-area">
        <div id="quizProgressDots" class="decision-progress-dots"></div>

        <article class="decision-question-card">
          <p id="quizStepText" class="decision-step-text">Question 1 of 7</p>
          <h2 id="quizQuestionTitle">What is your budget?</h2>

          <div id="quizAnswerList" class="decision-answer-list"></div>

          <div class="decision-question-actions">
            <button id="quizBackBtn" type="button">Back</button>
            <button id="quizRestartBtn" type="button">Restart</button>
          </div>
        </article>
      </section>

      <section class="decision-pattern-section">
        <h2>Your Food Patterns</h2>

        <div id="quizPatternCards" class="decision-pattern-grid"></div>
      </section>

      <section class="decision-recommendation-section">
        <div class="decision-section-title">
          <h2>Based on Your Pattern</h2>
          <span id="quizResultCount">Loading...</span>
        </div>

        <div id="quizRecommendationsGrid" class="decision-recommendation-grid">
          <div class="decision-empty-card">
            Loading recommendations...
          </div>
        </div>
      </section>
    </main>

    <script src="./quiz.js"></script>
  </body>
</html>
