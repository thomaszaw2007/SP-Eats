<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Browse Stalls | SP Eats</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="home-page stalls-discovery-page">
    <nav class="home-navbar">
      <a href="./index.html" class="home-logo">
        <span class="home-logo-badge">SP</span>
        <span>SP Eats</span>
      </a>

      <div class="home-nav-links">
        <a href="./index.html">Home</a>
        <a href="./stalls.html" class="active">Stalls</a>
        <a href="./food-map.html">Map</a>
        <a href="./reviews.html">Reviews</a>
        <a href="./quiz.html">Quiz</a>
      </div>

      <button id="stallsThemeToggle" class="home-theme-btn" type="button" aria-label="Toggle theme">
        ◐
      </button>
    </nav>

    <header class="stalls-discovery-hero">
      <div class="stalls-discovery-hero-content">
        <h1>Browse Food Stalls</h1>
        <p>Find every stall across all six campus food courts</p>
      </div>
    </header>

    <main class="stalls-discovery-main">
      <section class="stalls-filter-panel" aria-label="Stall filters">
        <div class="stalls-filter-main-row">
          <div class="stalls-search-field">
            <span aria-hidden="true">⌕</span>

            <input type="text" id="stallSearchInput" placeholder="Search stalls..." />
          </div>

          <select id="foodCourtFilter" aria-label="Filter by food court">
            <option value="all">All Food Courts</option>
            <option value="Food Court 1">Food Court 1</option>
            <option value="Food Court 2">Food Court 2</option>
            <option value="Food Court 3">Food Court 3</option>
            <option value="Food Court 4">Food Court 4</option>
            <option value="Food Court 5">Food Court 5</option>
            <option value="Food Court 6">Food Court 6</option>
          </select>

          <select id="cuisineFilter" aria-label="Filter by cuisine">
            <option value="all">All Cuisines</option>
            <option value="Korean">Korean</option>
            <option value="Japanese">Japanese</option>
            <option value="Chicken Rice">Chicken Rice</option>
            <option value="Noodles">Noodles</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Western">Western</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Soup">Soup</option>
          </select>

          <select id="statusFilter" aria-label="Filter by opening status">
            <option value="all">All Status</option>
            <option value="open">Open Now</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div class="stalls-diet-row">
          <span class="stalls-filter-label">Dietary:</span>

          <button class="sd-diet-chip" type="button" data-filter="spicy">Spicy</button>

          <button class="sd-diet-chip" type="button" data-filter="healthy">Healthy</button>

          <button class="sd-diet-chip" type="button" data-filter="high-protein">
            High Protein
          </button>

          <button class="sd-diet-chip" type="button" data-filter="light">Light</button>

          <button class="sd-diet-chip" type="button" data-filter="budget">Budget</button>
        </div>

        <div class="stalls-budget-row">
          <label for="budgetRange">Max Budget:</label>

          <input type="range" id="budgetRange" min="3" max="10" step="0.5" value="10" />

          <strong id="budgetValue">$10.00</strong>
        </div>

        <button id="clearStallFiltersBtn" class="stalls-clear-filter-btn" type="button">
          Clear Filters
        </button>
      </section>

      <section id="recentlyViewedSection" class="stalls-recent-section hidden">
        <p class="stalls-small-heading">Recently Viewed</p>

        <div id="recentlyViewedRow" class="stalls-recent-row">
          <!-- Recently viewed stall cards load here -->
        </div>
      </section>

      <section class="stalls-result-header">
        <div>
          <p class="stalls-result-kicker">Campus food stalls</p>
          <h2>Available Choices</h2>
        </div>

        <p id="stallResultCount" class="stalls-result-count">Loading stalls...</p>
      </section>

      <section id="stallContainer" class="stalls-discovery-grid">
        <!-- Stall cards load here -->
      </section>
    </main>

    <script src="./stalls.js"></script>
  </body>
</html>
