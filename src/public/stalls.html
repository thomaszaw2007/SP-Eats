<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Stalls | SP QuickBite</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <span class="sp-badge">SP</span>
      <span>QuickBite</span>
    </div>

    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./stalls.html" class="active">Browse Stalls</a>
      <a href="./menu.html">Full Menu</a>
    </div>
  </nav>

  <main class="page-container">
    <section class="page-header">
      <p class="small-title">Campus Dining</p>
      <h1>Browse Stalls</h1>
      <p>Find your favourite campus food stall and view their menu.</p>

      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search stalls or food items..."
        />
        <button id="searchButton">Search</button>
      </div>
    </section>

    <section class="filter-section">
      <button class="filter-btn active" data-type="all" data-value="all">All</button>
      <button class="filter-btn" data-type="category" data-value="Fast Food">Fast Food</button>
      <button class="filter-btn" data-type="category" data-value="Western">Western</button>
      <button class="filter-btn" data-type="foodCourt" data-value="Food Court 5">Food Court 5</button>
      <button class="filter-btn" data-type="foodCourt" data-value="T16">T16</button>
      <button class="filter-btn" data-type="status" data-value="open">Open Now</button>
    </section>

    <p id="resultCount" class="result-count">Loading stalls...</p>

    <section id="stallContainer" class="card-grid">
      <!-- Stall cards will appear here using JavaScript -->
    </section>
  </main>

  <script src="./stalls.js"></script>
</body>
</html>
