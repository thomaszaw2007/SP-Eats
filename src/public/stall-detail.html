<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stall Menu | SP QuickBite</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="stall-detail-page">
    <nav class="navbar">
      <div class="logo">
        <span class="sp-badge">SP</span>
        <span>QuickBite</span>
      </div>

      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./stalls.html" class="active">Browse Stalls</a>
      </div>
    </nav>

    <main class="page-container">
      <!-- Stall information loads here -->
      <section id="stallHeader" class="stall-detail-header">
        <p>Loading stall details...</p>
      </section>

      <!-- Menu section -->
      <section class="stall-menu-section">
        <div class="stall-menu-tools">
          <div class="stall-menu-search-box">
            <label for="stallMenuSearch">Search this menu</label>

            <div class="stall-menu-search-row">
              <input
                type="text"
                id="stallMenuSearch"
                placeholder="Search food name, category, description..."
              />

              <button id="clearStallMenuSearchBtn" type="button">
                Clear
              </button>
            </div>
          </div>

          <div class="stall-menu-sort-box">
            <label for="stallMenuSort">Sort menu</label>

            <select id="stallMenuSort">
              <option value="default">Default</option>
              <option value="name-asc">Name A-Z</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="popular-first">Popular First</option>
              <option value="available-first">Available First</option>
            </select>
          </div>
        </div>

        <div class="category-result-row">
          <div id="categoryContainer" class="stall-category-row"></div>

          <p id="menuResultCount" class="result-count menu-result-count">
            Loading menu...
          </p>
        </div>

        <section id="menuContainer" class="card-grid"></section>
      </section>
    </main>

    <!-- Menu item details modal -->
    <div id="menuItemModal" class="menu-modal-overlay hidden">
      <div class="menu-modal">
        <button id="closeMenuModalBtn" class="menu-modal-close" type="button">
          ×
        </button>

        <div id="menuItemModalContent">
          <!-- Menu item details load here -->
        </div>
      </div>
    </div>

    <script src="./stall-detail.js"></script>
  </body>
</html>
