<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stall Menu | SP QuickBite</title>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <span class="sp-badge">SP</span>
      <span>QuickBite</span>
    </div>

    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./stalls.html" class="active">Browse Stalls</a>
    </div>
  </nav>

  <main class="page-container">
    <a href="./stalls.html" class="back-link">← Back to Stalls</a>

    <!-- Stall information loads here -->
    <section id="stallHeader" class="stall-detail-header">
      <p>Loading stall details...</p>
    </section>

    <!-- Menu section -->
    <section class="stall-menu-section">
      <div class="section-title-row">
        <div>
          <p class="small-title red-text">Selected Stall Menu</p>
          <h2>Choose from this stall</h2>
        </div>

        <p id="menuResultCount" class="result-count">Loading menu...</p>
      </div>

      <!-- Popular picks will be inserted above this row by JavaScript -->

      <div id="categoryContainer" class="stall-category-row">
        <!-- Category buttons load here -->
      </div>

      <section id="menuContainer" class="card-grid">
        <!-- Menu item cards load here -->
      </section>
    </section>
  </main>

  <script src="./stall-detail.js"></script>
</body>
</html>
