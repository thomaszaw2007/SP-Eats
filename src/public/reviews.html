<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Review Hub | SP QuickBite</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="review-wall-page">
    <nav class="home-navbar review-wall-navbar">
      <a href="./index.html" class="home-logo">
        <span class="home-logo-badge">SP</span>
        <span>QuickBite</span>
      </a>

      <div class="home-nav-links">
        <a href="./index.html">Home</a>
        <a href="./stalls.html">Stalls</a>
        <a href="./food-map.html">Map</a>
        <a href="./reviews.html" class="active">Reviews</a>
        <a href="./quiz.html">Quiz</a>
      </div>
    </nav>

    <main class="review-wall-main">
      <section class="review-wall-controls">
        <div class="review-wall-top-controls">
          <div class="review-wall-search">
            <span>⌕</span>

            <input
              id="reviewSearchInput"
              type="text"
              placeholder="Search reviews..."
            />
          </div>

          <select id="reviewTagFilter">
            <option value="all">All</option>
          </select>

          <select id="reviewFoodCourtFilter">
            <option value="all">All</option>
          </select>

          <select id="reviewSortFilter">
            <option value="newest">Newest</option>
            <option value="highest">Highest rating</option>
            <option value="lowest">Lowest rating</option>
            <option value="dish">Dish name</option>
          </select>
        </div>

        <div class="review-wall-chip-row">
          <span class="review-wall-chip-label">Rating:</span>

          <button class="review-rating-chip active" data-rating="">All</button>
          <button class="review-rating-chip" data-rating="5">5★+</button>
          <button class="review-rating-chip" data-rating="4">4★+</button>
          <button class="review-rating-chip" data-rating="3">3★+</button>

          <span class="review-wall-chip-label tag-label">Tags:</span>

          <button class="review-tag-chip active" data-tag="all">All</button>
          <button class="review-tag-chip" data-tag="Value for money">Worth it</button>
          <button class="review-tag-chip" data-tag="Budget">Cheap</button>
          <button class="review-tag-chip" data-tag="Comfort food">Comfort food</button>
          <button class="review-tag-chip" data-tag="Healthy">Healthy choice</button>
        </div>
      </section>

      <p id="reviewResultCount" class="review-wall-count">
        Loading reviews...
      </p>

      <section id="reviewList" class="review-wall-grid">
      </section>
    </main>

    <script src="./reviews.js"></script>
  </body>
</html>
