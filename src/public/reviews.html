<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Hub | SP Eats</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body class="home-page review-page">
    <nav class="home-navbar">
      <a href="./index.html" class="home-logo">
        <span class="home-logo-badge">SP</span>
        <span>SP Eats</span>
      </a>

      <div class="home-nav-links">
        <a href="./index.html">Home</a>
        <a href="./stalls.html">Stalls</a>
        <a href="./food-map.html">Map</a>
        <a href="./reviews.html" class="active">Reviews</a>
        <a href="./quiz.html">Quiz</a>
      </div>

      <button id="reviewsThemeToggle" class="home-theme-btn" type="button">◐</button>
    </nav>

    <header class="review-hero">
      <div class="review-hero-content">
        <h1>Review Hub</h1>
        <p>See what other students are saying</p>

        <button id="openWriteReviewBtn" class="review-hero-btn" type="button">
          ✎ Write a Review
        </button>
      </div>
    </header>

    <main class="review-main">
      <section class="review-toolbar">
        <div class="review-search-wrap">
          <input type="text" id="reviewSearchInput" placeholder="Search reviews..." />
        </div>

        <select id="reviewRatingFilter">
          <option value="all">All Ratings</option>
          <option value="4plus">4★ & up</option>
          <option value="3plus">3★ & up</option>
          <option value="under3">Below 3★</option>
        </select>

        <select id="reviewTagFilter">
          <option value="all">All Tags</option>
          <option value="Worth it">Worth it</option>
          <option value="Large portion">Large portion</option>
          <option value="Spicy">Spicy</option>
          <option value="Cheap">Cheap</option>
          <option value="Long queue">Long queue</option>
          <option value="Good for lunch">Good for lunch</option>
          <option value="Comfort food">Comfort food</option>
          <option value="Healthy choice">Healthy choice</option>
        </select>

        <select id="reviewSortFilter">
          <option value="newest">Newest</option>
          <option value="highest">Highest Rated</option>
          <option value="lowest">Lowest Rated</option>
          <option value="helpful">Most Helpful</option>
        </select>
      </section>

      <div class="review-tag-chip-row">
        <button class="review-filter-chip active" data-filter-tag="all" type="button">All</button>
        <button class="review-filter-chip" data-filter-tag="Worth it" type="button">
          Worth it
        </button>
        <button class="review-filter-chip" data-filter-tag="Large portion" type="button">
          Large portion
        </button>
        <button class="review-filter-chip" data-filter-tag="Spicy" type="button">Spicy</button>
        <button class="review-filter-chip" data-filter-tag="Cheap" type="button">Cheap</button>
        <button class="review-filter-chip" data-filter-tag="Long queue" type="button">
          Long queue
        </button>
        <button class="review-filter-chip" data-filter-tag="Good for lunch" type="button">
          Good for lunch
        </button>
        <button class="review-filter-chip" data-filter-tag="Comfort food" type="button">
          Comfort food
        </button>
        <button class="review-filter-chip" data-filter-tag="Healthy choice" type="button">
          Healthy choice
        </button>
      </div>

      <p id="reviewCountText" class="review-count-text">Loading reviews...</p>

      <section id="reviewGrid" class="review-grid">
        <!-- review cards load here -->
      </section>
    </main>

    <!-- WRITE REVIEW MODAL -->
    <div id="writeReviewModal" class="review-modal-overlay hidden">
      <div class="write-review-modal">
        <div class="review-modal-header">
          <h2>Write a Review</h2>
          <button id="closeWriteReviewModalBtn" class="review-modal-close" type="button">×</button>
        </div>

        <form id="writeReviewForm" class="write-review-form">
          <button id="chooseFoodBtn" class="choose-food-trigger" type="button">
            <span class="choose-food-icon">⌕</span>
            <div id="selectedFoodSummary">
              <strong>Choose Food Item</strong>
            </div>
          </button>

          <input type="hidden" id="selectedFoodId" />

          <div class="rating-input-list">
            <div class="rating-input-row">
              <label>Overall</label>
              <div class="star-rating" data-rating-name="overall"></div>
            </div>

            <div class="rating-input-row">
              <label>Taste</label>
              <div class="star-rating" data-rating-name="taste"></div>
            </div>

            <div class="rating-input-row">
              <label>Value</label>
              <div class="star-rating" data-rating-name="value"></div>
            </div>

            <div class="rating-input-row">
              <label>Portion</label>
              <div class="star-rating" data-rating-name="portion"></div>
            </div>

            <div class="rating-input-row">
              <label>Wait Time</label>
              <div class="star-rating" data-rating-name="wait_time"></div>
            </div>
          </div>

          <div class="write-review-section">
            <label>Tags</label>
            <div id="reviewTagPicker" class="review-tag-picker">
              <button type="button" class="review-tag-option" data-tag="Worth it">Worth it</button>
              <button type="button" class="review-tag-option" data-tag="Large portion">
                Large portion
              </button>
              <button type="button" class="review-tag-option" data-tag="Spicy">Spicy</button>
              <button type="button" class="review-tag-option" data-tag="Cheap">Cheap</button>
              <button type="button" class="review-tag-option" data-tag="Long queue">
                Long queue
              </button>
              <button type="button" class="review-tag-option" data-tag="Good for lunch">
                Good for lunch
              </button>
              <button type="button" class="review-tag-option" data-tag="Comfort food">
                Comfort food
              </button>
              <button type="button" class="review-tag-option" data-tag="Healthy choice">
                Healthy choice
              </button>
            </div>
          </div>

          <div class="write-review-section">
            <label for="reviewTextInput">Review</label>
            <textarea
              id="reviewTextInput"
              placeholder="Share your thoughts..."
              maxlength="500"
            ></textarea>
            <p id="reviewTextCounter" class="review-text-counter">0/500</p>
          </div>

          <div class="write-review-section">
            <label for="reviewPhotoUrlInput">Photo (optional)</label>
            <input
              type="url"
              id="reviewPhotoUrlInput"
              class="review-photo-url-input"
              placeholder="Paste image URL here..."
            />
          </div>

          <button class="post-review-btn" type="submit">Post Review</button>
        </form>
      </div>
    </div>

    <!-- CHOOSE FOOD MODAL -->
    <div id="chooseFoodModal" class="review-modal-overlay hidden">
      <div class="choose-food-modal">
        <div class="review-modal-header">
          <h2>Choose Food Item</h2>
          <button id="closeChooseFoodModalBtn" class="review-modal-close" type="button">×</button>
        </div>

        <div class="choose-food-toolbar">
          <input type="text" id="foodPickerSearchInput" placeholder="Search food..." />

          <select id="foodPickerCategoryFilter">
            <option value="all">All</option>
            <option value="Rice">Rice</option>
            <option value="Noodles">Noodles</option>
            <option value="Drinks">Drinks</option>
            <option value="Sides">Sides</option>
            <option value="Snacks">Snacks</option>
          </select>

          <select id="foodPickerFoodCourtFilter">
            <option value="all">All Food Courts</option>
            <option value="FC1 — Central Hub">FC1 — Central Hub</option>
            <option value="FC2 — East Wing">FC2 — East Wing</option>
            <option value="FC3 — West Garden">FC3 — West Garden</option>
            <option value="FC4 — North Plaza">FC4 — North Plaza</option>
            <option value="FC5 — South Corner">FC5 — South Corner</option>
            <option value="FC6 — Hill View">FC6 — Hill View</option>
          </select>
        </div>

        <div id="foodPickerGrid" class="food-picker-grid">
          <!-- food cards load here -->
        </div>
      </div>
    </div>

    <script src="./reviews.js"></script>
  </body>
</html>
